name: Paydar Agent Windows Preview
on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'
      - name: Build the Windows service, tray and installer
        shell: pwsh
        run: ./scripts/build-paydar-agent.ps1 -Version ${{ github.ref_name }}
      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paydar-agent-preview
          path: |
            artifacts/Paydar-Agent-*.exe
            artifacts/Paydar-Agent-*.zip
      - name: Publish GitHub prerelease for tag
        if: startsWith(github.ref, 'refs/tags/agent-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} artifacts/Paydar-Agent-*.exe artifacts/Paydar-Agent-*.zip --repo "${{ github.repository }}" --title "Paydar Agent ${{ github.ref_name }}" --prerelease --notes "Unsigned preview for authorized internal pilots only. Requires approved gateway client certificate. Automatic updates are disabled."
