name: Paydar Agent Windows Preview
on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'
      - name: Verify .NET contracts, service and API
        shell: pwsh
        run: dotnet test InfraGraph.sln -c Release -m:1 -p:UseSharedCompilation=false
      - name: Build the Windows service, tray and installer
        shell: pwsh
        run: ./scripts/build-paydar-agent.ps1 -Version ($env:GITHUB_REF_NAME -replace '^agent-v', '')
      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paydar-agent-preview
          path: |
            artifacts/Paydar-Agent-*.exe
            artifacts/Paydar-Agent-*.zip
      - name: Publish GitHub prerelease for tag
        if: startsWith(github.ref, 'refs/tags/agent-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = @(Get-ChildItem artifacts -File | Where-Object { $_.Name -like 'Paydar-Agent-*.exe' -or $_.Name -like 'Paydar-Agent-*.zip' })
          if ($files.Count -ne 2) { throw 'Expected two release artifacts' }
          gh release create $tag $files[0].FullName $files[1].FullName --repo $env:GITHUB_REPOSITORY --title "Paydar Agent $tag" --prerelease --notes "Unsigned preview for authorized internal pilots only. Requires preapproved gateway client certificate. Automatic updates are disabled."